services:
  zenohd:
    # 使用與 mediapipe_ai 相同的 ros:kilted-perception 基礎映像，
    # 確保 rmw_zenohd 版本與容器及主機端的 rmw_zenoh_cpp 完全一致。
    # （不使用 eclipse/zenoh:latest，避免 zenoh 協定版本不符造成通訊失敗）
    build: .
    network_mode: host
    command: /bin/bash -c "source /opt/ros/kilted/setup.bash && ros2 run rmw_zenoh_cpp rmw_zenohd"
    # 確認 zenohd 確實已在 TCP 7447 埠監聽後，才允許 mediapipe_ai 啟動
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/7447"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  mediapipe_ai:
    build: .
    # 與主機共用網路堆疊，讓容器節點可連接同一台主機上的 zenohd router
    network_mode: host
    # 與主機共用 IPC namespace，允許 Zenoh 使用共享記憶體傳輸（提升效能）
    ipc: host
    shm_size: 2gb
    depends_on:
      zenohd:
        # 等待 zenohd 通過 healthcheck（確認 7447 埠可連）才啟動本服務，
        # 避免 rmw_zenoh_cpp client 因 router 尚未就緒而連線失敗
        condition: service_healthy
    environment:
      # ROS2 Domain ID 需與主機端一致（預設 0）
      - ROS_DOMAIN_ID=0
      # ROS2 Kilted 預設 rmw_zenoh_cpp；節點會自動連接 localhost:7447 的 zenohd router
    volumes:
      # 掛載本機已下載的 MediaPipe 模型權重檔
      # 使用前請確認 ./models/hand_landmarker.task 存在
      - ./models:/app/models:ro
    restart: unless-stopped

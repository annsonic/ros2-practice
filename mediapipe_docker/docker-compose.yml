services:
  mediapipe_ai:
    build: .
    # 與主機共用網路堆疊，讓 DDS 多播自動發現主機上的 ROS2 節點
    network_mode: host
    # 與主機共用 IPC namespace，允許 DDS 使用共享記憶體傳輸（提升效能）
    ipc: host
    shm_size: 2gb
    environment:
      # ROS2 Domain ID 需與主機端一致（預設 0）
      - ROS_DOMAIN_ID=0
    volumes:
      # 掛載本機已下載的 MediaPipe 模型權重檔
      # 使用前請確認 ./models/hand_landmarker.task 存在
      - ./models:/app/models:ro
    restart: unless-stopped

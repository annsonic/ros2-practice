services:
  mediapipe_ai:
    build: .
    # 與主機共用網路堆疊，讓 DDS 多播自動發現主機上的 ROS2 節點
    network_mode: host
    # 與主機共用 IPC namespace，允許 DDS 使用共享記憶體傳輸（提升效能）
    ipc: host
    shm_size: 2gb
    environment:
      # ROS2 Domain ID 需與主機端一致（預設 0）
      - ROS_DOMAIN_ID=0
      # ROS2 Kilted 預設 rmw_zenoh_cpp；Zenoh 在 Docker network_mode: host 下
      # 需要 zenohd router 才能讓容器節點被主機端發現。
      # 改用 CycloneDDS：以 UDP multicast 做節點發現，network_mode: host 下開箱即用。
      # ⚠️  主機端也必須設定相同值（見 README 啟動步驟）。
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      # 掛載本機已下載的 MediaPipe 模型權重檔
      # 使用前請確認 ./models/hand_landmarker.task 存在
      - ./models:/app/models:ro
    restart: unless-stopped
